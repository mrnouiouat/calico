version: 2

models:
  - name: int_public_organization_eligibility
    description: >
      Grain: one row per distinct exact full nonblank State Charity
      registration key ever observed in int_keyed_snapshots. Private audit
      helper, not a required grain owner (D-01). Left joins every key to
      the private runtime_input.public_eligibility_classifications source
      and defaults a missing match to 'eligible' (owner decision
      2026-09-15, superseding D-18's exclude-by-default rule). Retains all
      three closed states for private audit; only an explicit 'eligible'
      row may ever reach dim_public_organizations or
      fct_public_status_observations downstream, so an explicit
      'ambiguous_natural_person' or 'unclassified' sidecar entry remains
      the exclusion mechanism. Independently
      reconciled by assert_public_organization_eligibility.sql.
      Materialized as an explicit view.
    columns:
      - name: state_charity_registration_number
        description: "The exact full nonblank longitudinal key. Unique within this relation (one row per distinct key)."
        tests:
          - not_null
          - unique
      - name: eligibility_classification
        description: "The closed three-value classification, defaulting to 'eligible' whenever the private sidecar carries no matching entry for this key (owner decision 2026-09-15). An explicit sidecar entry is the only way to exclude a key."
        tests:
          - not_null
          - accepted_values:
              values:
                - eligible
                - ambiguous_natural_person
                - unclassified
      - name: classification_version
        description: "The reviewed sidecar's own classification_version, carried through for audit. Null whenever this key has no matching sidecar entry (i.e. eligibility_classification = 'eligible' by default, not by explicit review)."
