version: 2

models:
  - name: int_public_organization_eligibility
    description: >
      Grain: one row per distinct exact full nonblank State Charity
      registration key ever observed in int_keyed_snapshots. Private audit
      helper, not a required grain owner (D-01). Left joins every key to
      the private runtime_input.public_eligibility_classifications source
      and normalizes a missing match to 'unclassified' -- the fail-closed
      default (D-18). Retains all three closed states for private audit;
      only an explicit 'eligible' row may ever reach dim_public_organizations
      or fct_public_status_observations downstream. Independently
      reconciled by assert_public_organization_eligibility.sql.
      Materialized as an explicit view.
    columns:
      - name: state_charity_registration_number
        description: "The exact full nonblank longitudinal key. Unique within this relation (one row per distinct key)."
        tests:
          - not_null
          - unique
      - name: eligibility_classification
        description: "The closed three-value classification, normalized to 'unclassified' whenever the private sidecar carries no matching entry for this key (D-18)."
        tests:
          - not_null
          - accepted_values:
              values:
                - eligible
                - ambiguous_natural_person
                - unclassified
      - name: classification_version
        description: "The reviewed sidecar's own classification_version, carried through for audit. Null whenever this key has no matching sidecar entry (i.e. eligibility_classification = 'unclassified' by default, not by explicit review)."
