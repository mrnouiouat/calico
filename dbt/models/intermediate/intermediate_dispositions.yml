version: 2

models:
  - name: int_registry_record_dispositions
    description: >
      Total, one-row-per-promoted-record disposition (D-11). Every row from
      `int_promoted_registry_records` receives exactly one closed disposition
      from a single exhaustive `case` -- `eligible_for_keyed_path`,
      `untracked_blank_registration`, or `excluded_from_typed_path_blank_status`
      -- so a later filter can never make a source record disappear without
      an auditable outcome.
      `int_keyless_registry_coverage` and `int_registry_record_exclusions`
      are convenience selections over this one relation, not independent
      filters.
    columns:
      - name: as_of_date
        description: "Bound release identity: the promoted as_of_date this row belongs to."
        tests:
          - not_null
      - name: release_revision
        description: "Bound release identity: the promoted revision number for this date."
        tests:
          - not_null
      - name: revision_fingerprint
        description: "Bound release identity: the promoted revision's ordered-source-hash fingerprint -- this row's manifest/object-hash identity."
        tests:
          - not_null
      - name: parser_contract_version
        description: "The admission parser contract version this row's promoted revision was admitted under, carried in from `int_promoted_releases` on the full release key."
        tests:
          - not_null
      - name: source_list
        description: "Structural provenance: which of the four fixed published logical lists this row was admitted from."
        tests:
          - not_null
      - name: source_line_no
        description: "Structural provenance: the physical source line number this row was parsed from within its logical list's canonical object."
        tests:
          - not_null
      - name: state_charity_registration_number
        description: >
          The sole longitudinal identity key (D-10), passed through
          unchanged from `int_promoted_registry_records`: the exact full
          trimmed nonblank 'State Charity Reg#' value, or null when the
          source reported it blank. Never substring-matched, truncated, or
          coalesced with FEIN or any other column.
      - name: source_reported_registry_status
        description: "Trimmed source 'Registry Status' value, passed through unchanged, or null when the source reported it blank."
      - name: source_reported_organization_name
        description: "Trimmed source 'Name' value, passed through unchanged for audit review."
      - name: source_reported_city
        description: "Trimmed source 'City' value, passed through unchanged for audit review."
      - name: source_reported_state
        description: "Trimmed source 'State' value, passed through unchanged for audit review."
      - name: disposition
        description: >
          The closed Phase 3 disposition vocabulary. `eligible_for_keyed_path`
          means both the registration and status are nonblank;
          `untracked_blank_registration` means the registration is blank
          (D-10, checked first, unconditional on status);
          `excluded_from_typed_path_blank_status` means the registration is
          nonblank but the status is blank (D-11).
        tests:
          - not_null
          - accepted_values:
              values:
                - eligible_for_keyed_path
                - untracked_blank_registration
                - excluded_from_typed_path_blank_status

  - name: int_keyless_registry_coverage
    description: >
      Auditable untracked blank-registration coverage (D-10): a convenience
      selection of `int_registry_record_dispositions` where
      `disposition = 'untracked_blank_registration'`.
    columns:
      - name: disposition
        description: "Always 'untracked_blank_registration' in this relation."
        tests:
          - accepted_values:
              values:
                - untracked_blank_registration

  - name: int_registry_record_exclusions
    description: >
      Auditable stable-reason typed-path exclusions (D-11): a convenience
      selection of `int_registry_record_dispositions` where `disposition`
      is one of the closed `excluded_from_typed_path_*` reasons.
    columns:
      - name: disposition
        description: "Always an 'excluded_from_typed_path_*' reason in this relation."
        tests:
          - accepted_values:
              values:
                - excluded_from_typed_path_blank_status
