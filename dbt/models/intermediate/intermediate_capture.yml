version: 2

models:
  - name: stg_capture_attempts
    description: >
      Grain: one row per durable attempt JSON file `calico_dbt.preflight`
      validated and parameter-bound from `runtime_input.capture_attempts`.
      Structural pass-through only (D-02) -- casts/retains the fields
      `calico_landing.attempts` already validated across all three closed
      shapes; no outcome normalization or timing derivation happens here.
      Materialized as an explicit view.
    columns:
      - name: attempt_id
        description: "The durable attempt identity. Unique within this relation (one row per attempt file)."
        tests:
          - not_null
          - unique
      - name: attempt_shape
        description: "Which of the three closed shapes produced this row: 'admission_v1', 'store_v1', or 'v2'."
        tests:
          - not_null
          - accepted_values:
              values:
                - admission_v1
                - store_v1
                - v2
      - name: source_schema_version
        description: "The source document's own schema_version field: 1 for both legacy shapes, 2 for the additive v2 shape."
        tests:
          - not_null
          - accepted_values:
              values:
                - 1
                - 2
      - name: raw_status
        description: "The source document's own status field, unchanged. int_capture_runs.sql maps (attempt_shape, raw_status) pairs to the closed normalized_outcome vocabulary."
        tests:
          - not_null
      - name: as_of_date
        description: "Best-effort source as-of date, or null when no candidate date could be structurally determined (a candidate-boundary rejection before any row was parsed)."
      - name: release_revision
        description: "The committed release revision number, present only for accepted/no_new_release/recovered outcomes."
      - name: revision_fingerprint
        description: "The committed revision's ordered-source-hash fingerprint, present only for accepted/no_new_release/recovered outcomes."
      - name: reason_count
        description: "The number of structural admission-rejection reasons, present only for a rejected outcome."
      - name: recovered
        description: "The legacy store-level v1 shape's own recovered boolean, present only for that shape; null for admission_v1 and v2 rows (v2 instead uses its own closed 'recovered' status value)."
      - name: started_at_utc
        description: "Actual UTC start timestamp, present only for the v2 shape; always null for both legacy v1 shapes (D-13: timing is genuinely unavailable for them, never invented)."
      - name: ended_at_utc
        description: "Actual UTC end timestamp, present only for the v2 shape; always null for both legacy v1 shapes."

  - name: int_capture_runs
    description: >
      Grain: one row per durable attempt_id (D-12). Authoritative
      capture-run fact retaining every accepted, no_new_release, rejected,
      and recovered attempt -- outcomes an accepted-revision history alone
      can never reconstruct. Normalizes the closed (attempt_shape,
      raw_status) pairs into one exhaustive normalized_outcome, derives
      timing_state, and calculates duration_seconds only for ordered
      actual v2 UTC bounds (D-13); legacy v1 rows are always
      timing_unavailable with a null duration. Independently reconciled by
      `assert_capture_run_normalization.sql`. Materialized as an explicit
      view.
    columns:
      - name: attempt_id
        description: "The durable attempt identity. One row per attempt (the declared grain)."
        tests:
          - not_null
          - unique
      - name: normalized_outcome
        description: "The closed structural capture outcome, normalized in SQL from the raw per-shape status (D-02)."
        tests:
          - not_null
          - accepted_values:
              values:
                - accepted
                - no_new_release
                - rejected
                - recovered
      - name: timing_state
        description: "'timing_available' only for a v2 record with both UTC bounds present; 'timing_unavailable' for every legacy v1 record and any v2 record missing a bound."
        tests:
          - not_null
          - accepted_values:
              values:
                - timing_available
                - timing_unavailable
      - name: duration_seconds
        description: "Calculated only when timing_state = 'timing_available' and the parsed bounds are correctly ordered (ended_at_utc >= started_at_utc); otherwise null. Never negative and never inferred from anything but the two actual captured timestamps."

  - name: int_release_flags
    description: >
      Grain: one row per named/versioned rule plus the release or
      release-pair identity it evaluates (D-14). Tall and auditable: three
      union branches (parser_contract_version_known_v1,
      capture_outcome_available_v1 -- both deterministic;
      keyed_coverage_change_fraction_v1 -- heuristic_review) each project
      the identical explicit column shape. Heuristic rows are review
      signals only, never an anomaly/risk/quality score, ranking,
      recommendation, or admission decision (T-04-04E). Independently
      reconciled by `assert_release_flag_grain.sql`. Materialized as an
      explicit view.
    columns:
      - name: rule_id
        description: "The named rule identifier, e.g. 'parser_contract_version_known_v1'."
        tests:
          - not_null
      - name: rule_version
        description: "The rule's own integer version, independent of rule_id's embedded '_v1' naming convention."
        tests:
          - not_null
      - name: rule_class
        description: "Visibly separates deterministic rules from heuristic-review rules (T-04-04E)."
        tests:
          - not_null
          - accepted_values:
              values:
                - deterministic
                - heuristic_review
      - name: scope
        description: "'release' for a single-release rule row, or 'release_pair' for an adjacent-pair rule row. The two identity shapes never overlap on the same row."
        tests:
          - not_null
          - accepted_values:
              values:
                - release
                - release_pair
      - name: observed_value
        description: "The rule's own observed input value, rendered as text for a uniform column type across every rule's differently-shaped input -- never a score, rank, or characterization, only the raw fact the rule evaluated."
      - name: parameter_version
        description: "The rule's own versioned parameter/threshold identifier, e.g. 'absolute-relative-change-0.10-v1'."
        tests:
          - not_null
      - name: result
        description: "The closed rule-result vocabulary. 'not_applicable' means the rule's own precondition was not met (e.g. a zero starting keyed count); it is never treated as a pass or a failure."
        tests:
          - not_null
          - accepted_values:
              values:
                - pass
                - review
                - not_applicable
      - name: supersedes_rule_id
        description: "Nullable pointer to an earlier rule_id this row's rule additively corrects (D-022 no-silent-rewrite convention). Null for every rule in this plan; reserved for a later additive rule correction."
      - name: supersedes_rule_version
        description: "Nullable pointer to an earlier rule_version this row's rule additively corrects. Null for every rule in this plan."
