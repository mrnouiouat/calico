version: 2

models:
  - name: int_keyed_snapshots
    description: >
      Grain: one row per promoted full release identity
      (as_of_date, release_revision, revision_fingerprint) plus the exact
      full nonblank State Charity registration number (D-04). Selected
      only where Phase 3's disposition `case` classified the row
      `eligible_for_keyed_path` -- both registration and status are
      nonblank. Keyless rows and blank-status typed-path exclusions never
      enter this relation; all three closed Phase 3 disposition classes
      reconcile exactly back to `int_promoted_registry_records`, globally
      and by full release identity/source list/source-reported status
      (`assert_keyed_snapshot_reconciliation.sql`). `is_delinquent` is
      derived once here from the two exact locked D-06 statuses.
      Materialized as a `view`: a light disposition-first selection, not a
      reused heavy transform.
    columns:
      - name: as_of_date
        description: "Bound release identity: the promoted as_of_date this row belongs to."
        tests:
          - not_null
      - name: release_revision
        description: "Bound release identity: the promoted revision number for this date."
        tests:
          - not_null
      - name: revision_fingerprint
        description: "Bound release identity: the promoted revision's manifest/object-hash fingerprint."
        tests:
          - not_null
      - name: parser_contract_version
        description: "The admission parser contract version this row's promoted revision was admitted under."
        tests:
          - not_null
      - name: source_list
        description: "Structural provenance: which of the four fixed published logical lists this row was admitted from."
        tests:
          - not_null
      - name: source_line_no
        description: "Structural provenance: the physical source line number this row was parsed from."
        tests:
          - not_null
      - name: state_charity_registration_number
        description: >
          The sole longitudinal identity key (D-05): the exact full
          trimmed nonblank 'State Charity Reg#' value. Never null in this
          relation (composite uniqueness on release identity + this key
          is independently proven by `assert_keyed_snapshot_reconciliation.sql`,
          since dbt's generic `unique` test cannot express a composite key
          without an added dependency).
        tests:
          - not_null
      - name: source_reported_registry_status
        description: "Trimmed source 'Registry Status' value. Never null in this relation (eligibility requires a nonblank status)."
        tests:
          - not_null
      - name: is_delinquent
        description: >
          Derived directly from the two exact locked D-06 published
          delinquent population statuses ('Delinquent',
          'Delinquent - Late Fees Due') -- never a substring or heuristic
          match, and never recomputed downstream.
        tests:
          - not_null

  - name: int_unkeyed_coverage
    description: >
      Grain: one row per promoted full release identity, source list, and
      source-reported status (D-04). Groups the delivered row-level
      `int_keyless_registry_coverage` audit relation by that grain without
      reimplementing the blank-registration predicate; nullable status is
      retained honestly. Reconciles exactly against the row-level relation
      (`assert_keyed_snapshot_reconciliation.sql`). Materialized as a
      `view`.
    columns:
      - name: as_of_date
        tests:
          - not_null
      - name: release_revision
        tests:
          - not_null
      - name: revision_fingerprint
        tests:
          - not_null
      - name: source_list
        tests:
          - not_null
      - name: record_count
        description: "Count of untracked blank-registration rows for this partition."
        tests:
          - not_null

  - name: int_entity_transitions
    description: >
      Grain: one row per delivered adjacent-release pair identity plus the
      exact registration key observed at either endpoint (D-05, D-21
      representative model). The full endpoint union of three explicit
      branches -- observed at both (inner join), start-only (anti join),
      and end-only (anti join) -- independently proven complete and
      duplicate-free by `assert_transition_endpoint_union.sql`, with pair
      locality proven by `assert_transition_pair_membership.sql`. A
      missing endpoint is always an observation-flag distinction, never a
      coalesced status. Exactly one of eight closed, mutually exclusive
      transition classes is assigned
      (`assert_transition_classification.sql`); both source-reported
      diagnostic dates carry an explicit start/end prefix and never drive
      classification (D-07). Materialized as a full-refresh `table`: a
      reused heavy transform (Phase 5 and both singular tests select
      against it repeatedly).
    columns:
      - name: from_as_of_date
        tests:
          - not_null
      - name: to_as_of_date
        tests:
          - not_null
      - name: gap_days
        tests:
          - not_null
      - name: state_charity_registration_number
        tests:
          - not_null
      - name: observed_at_start
        tests:
          - not_null
      - name: observed_at_end
        tests:
          - not_null
      - name: transition_class
        description: >
          The closed eight-value D-06 transition classification. A
          missing endpoint is always reflected in the observation flags,
          never coalesced into an invented status.
        tests:
          - not_null
          - accepted_values:
              values:
                - delinquency_entry_observed
                - delinquent_newly_observed
                - delinquency_exit_observed
                - delinquency_still_observed
                - delinquent_lost_to_observation
                - observed_status_movement_other
                - newly_observed_other
                - not_observed_after_other

  - name: int_transition_matrix
    description: >
      Grain: one row per exact adjacent-release pair identity, both
      observation flags, the closed transition class, and start/end
      status (REQ-sql-techniques conditional-aggregation/transition-matrix
      demonstration). An internal Phase 5 integration helper only -- never
      a published headline mart, and asserts no real-data total or claim.
      Materialized as a `view`.
    columns:
      - name: transition_count
        description: "Plain row count for this exact grouping -- not a published metric."
        tests:
          - not_null
