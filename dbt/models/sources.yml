version: 2

# Fixed `runtime_input` source contract (D-03, T-03-06). `calico_dbt.preflight`
# always creates exactly this schema and these six relation names -- four
# logical-list registry relations plus the revision and promotion catalogs --
# whether the caller ran fixture or real mode. This file names those already
# fixed relations; it never contains a path, an environment expression, or a
# mode-conditional Jinja block, because mode selection may only change how
# `runtime_input` is populated, never what dbt sees once it is populated
# (D-01..D-04).
sources:
  - name: runtime_input
    schema: runtime_input
    description: >
      Verified, opaque-copy-bound admitted registry input. Populated
      identically by fixture mode (Plan 01's closed synthetic candidates
      admitted through the real Phase 2 boundary) and real mode (an
      owner-supplied admitted store verified against the committed safe
      catalog anchor) before dbt ever runs (calico_dbt.preflight).
    tables:
      - name: charities_may_operate
        description: "Admitted rows from the 'charities-may-operate' published logical list, one row per physical source line, across every immutable revision preflight verified for this build."
      - name: charities_not_operating
        description: "Admitted rows from the 'charities-not-operating' published logical list, one row per physical source line, across every immutable revision preflight verified for this build."
      - name: charities_undetermined_status
        description: "Admitted rows from the 'charities-undetermined-status' published logical list, one row per physical source line, across every immutable revision preflight verified for this build."
      - name: charities_may_not_operate
        description: "Admitted rows from the 'charities-may-not-operate' published logical list, one row per physical source line, across every immutable revision preflight verified for this build."
      - name: revision_catalog
        description: "One row per immutable admitted revision preflight verified for this build: as_of_date, release_revision, revision_fingerprint, parser_contract_version. Every accepted revision is present for audit, not only the promoted one (D-05)."
      - name: promotion_catalog
        description: "One row per as_of_date present in the store's atomic promotion pointer, cross-checked by preflight against revision_catalog before dbt runs (D-06). A date absent here has no validated pointer entry; the pointer-or-highest-revision decision for that date is made in dbt SQL, never in Python."
