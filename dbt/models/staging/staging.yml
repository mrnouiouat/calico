version: 2

models:
  - name: base_admitted_registry_records
    description: >
      All-revision audit base (D-05, D-08): an explicit `union all` over the
      four fixed `runtime_input` registry source relations. Every source
      value and every bound release-identity/provenance column passes
      through unchanged -- no cast, no trim, no rename, no glob, and no
      `union_by_name`. Contains every admitted revision preflight verified
      for this build, not only the promoted one per date.

  - name: stg_registry_records
    description: >
      Universally trimmed, honestly named registry staging over
      `base_admitted_registry_records` (D-09, D-10). One row per admitted
      physical source line across every verified revision. Identity,
      release, and structural provenance are unchanged from the base; every
      other source string is `nullif(trim(source), '')`.
    columns:
      - name: source_reported_registry_status
        description: "Trimmed source 'Registry Status' value. The publicly reported disposition category the record belonged to at capture (may-operate, not-operating, undetermined-status, may-not-operate)."
      - name: state_charity_registration_number
        description: >
          The sole longitudinal identity key (D-10): the exact full trimmed
          nonblank 'State Charity Reg#' value, or null when the source
          reported it blank. Never substring-matched, never truncated, and
          never coalesced with FEIN or any other column. A null value is an
          explicit untracked-coverage state, not a dropped record.
      - name: source_reported_federal_employer_identification_number
        description: >
          Trimmed source 'FEIN' value, retained only for internal row-level
          reconciliation. This is the excluded federal identifier (D-005):
          it is never used, exposed, hashed, coalesced, or joined as
          identity, and it is excluded from every publication path
          (Phase 7/8 publication boundary).
      - name: source_reported_sos_or_ftb_number
        description: "Trimmed source 'SOS/FTB#' value, passed through as reported with no identity role."
      - name: source_reported_organization_name
        description: "Trimmed source 'Name' value -- the honestly reported organization name as published, never characterized or scored."
      - name: source_reported_city
        description: "Trimmed source 'City' value."
      - name: source_reported_state
        description: "Trimmed source 'State' value."
      - name: source_reported_issue_date
        description: "Trimmed source 'Issue Date' value, typed to DATE via try_cast. Null when blank or when a nonblank value failed to parse (see the companion _nonblank_unparseable flag)."
      - name: source_reported_issue_date_nonblank_unparseable
        description: "True when the source 'Issue Date' was nonblank but failed DATE typing -- keeps a failed cast detectable instead of letting it silently disappear into null."
      - name: source_reported_last_renewal_date
        description: >
          D1: the source-reported 'Last Renewal' value, typed to DATE via
          try_cast. Explicitly source-reported and semantically unresolved
          -- this is never an accepted-submission date and must never be
          treated as one by any downstream model.
      - name: source_reported_last_renewal_date_nonblank_unparseable
        description: "True when the source 'Last Renewal' value was nonblank but failed DATE typing."
      - name: source_reported_current_status_date
        description: >
          D3: the source-reported 'Date Status Set' value, typed to DATE via
          try_cast. Exposed only as a source-reported current-status date --
          this is never an exact onset date and must never be treated as one
          by any downstream model.
      - name: source_reported_current_status_date_nonblank_unparseable
        description: "True when the source 'Date Status Set' value was nonblank but failed DATE typing."
      - name: source_reported_as_of_date
        description: "Trimmed source 'As-of Date' value, as reported inside the physical record itself. Distinct from the bound `as_of_date` release-identity column below, which is the verified release date this entire revision was admitted under."
      - name: as_of_date
        description: "Bound release identity: the as_of_date of the admitted revision this row belongs to (release identity, not a source-reported field)."
      - name: release_revision
        description: "Bound release identity: the revision number of the admitted revision this row belongs to."
      - name: revision_fingerprint
        description: "Bound release identity: the ordered-source-hash fingerprint of the admitted revision this row belongs to."
      - name: source_list
        description: "Structural provenance: which of the four fixed published logical lists this row was admitted from."
      - name: source_line_no
        description: "Structural provenance: the physical source line number this row was parsed from within its logical list's canonical object."
