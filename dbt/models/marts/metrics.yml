version: 2

models:
  - name: mart_claim_support
    description: >
      Grain: one identity-free row for the first exact adjacent accepted-release
      pair, with the next-pair matched-entry comparison. This internal relation
      supports bounded descriptive language about the published delinquent
      population and its source-reported status-date pattern. An observed exit
      remains distinct from not observed. Last Renewal remains a release-quality
      diagnostic and never defines the supported movement.
    columns:
      - name: claim_support_version
        tests:
          - not_null
          - accepted_values:
              values: [claim_support_status_movement_v1]
      - name: from_as_of_date
        tests: [not_null]
      - name: from_release_revision
        tests: [not_null]
      - name: from_revision_fingerprint
        tests: [not_null]
      - name: to_as_of_date
        tests: [not_null]
      - name: to_release_revision
        tests: [not_null]
      - name: to_revision_fingerprint
        tests: [not_null]
      - name: gap_days
        tests: [not_null]
      - name: matched_start_status
        tests:
          - not_null
          - accepted_values:
              values: ['Current - Reporting Incomplete']
      - name: matched_end_population
        tests:
          - not_null
          - accepted_values:
              values: [published_delinquent_population_v1]
      - name: support_count
        tests: [not_null]
      - name: support_denominator_count
        tests: [not_null]
      - name: support_denominator_id
        tests:
          - not_null
          - accepted_values:
              values: [matched_observed_entry_population_v1]
      - name: total_matched_entry_count
        tests: [not_null]
      - name: matched_entry_denominator_id
        tests:
          - not_null
          - accepted_values:
              values: [matched_observed_entry_population_v1]
      - name: total_entrant_count
        tests: [not_null]
      - name: total_entrant_denominator_id
        tests:
          - not_null
          - accepted_values:
              values: [all_entrant_population_v1]
      - name: dominant_status_date_count
        tests: [not_null]
      - name: dominant_status_date_denominator_count
        tests: [not_null]
      - name: dominant_status_date_denominator_id
        tests:
          - not_null
          - accepted_values:
              values: [matched_observed_entry_population_v1]
      - name: support_share_of_matched_entries
        description: "SQL-computed support count divided by the matched observed entry denominator; null for zero denominator."
      - name: dominant_source_reported_status_date
        description: "Deterministic most frequent source-reported status date among matched observed entries."
      - name: dominant_status_date_share
        description: "SQL-computed dominant status-date count divided by its matched observed entry denominator."
      - name: next_from_as_of_date
        description: "Start date of the next exact adjacent accepted-release pair."
      - name: next_to_as_of_date
        description: "End date of the next exact adjacent accepted-release pair."
      - name: next_gap_days
        description: "Calendar-day gap in the next adjacent accepted-release pair."
      - name: next_total_matched_entry_count
        description: "Matched observed entry count in the next exact adjacent pair."

  - name: mart_last_renewal_diagnostic
    description: >
      Grain: one row per exact adjacent accepted-release pair and one of exactly
      three Last Renewal release-quality diagnostic measures. This relation does
      not define events, thresholds, scores, spells, or organization history.
    columns:
      - name: diagnostic_role
        tests:
          - not_null
          - accepted_values:
              values: [release_quality_diagnostic]
      - name: measure_name
        tests:
          - not_null
          - accepted_values:
              values: [conditional_precision, eligible_exit_sensitivity, all_exit_sensitivity]
      - name: denominator_definition_id
        tests:
          - not_null
          - accepted_values:
              values: [starting_delinquent_diagnostic_clears_v1, observed_exits_with_populated_start_v1, all_observed_exits_v1]
      - name: diagnostic_eligible_count
        tests: [not_null]
      - name: numerator_count
        tests: [not_null]
      - name: denominator_count
        tests: [not_null]
      - name: from_as_of_date
        description: "Starting accepted release as-of date."
      - name: from_release_revision
        description: "Starting accepted release revision number."
      - name: from_revision_fingerprint
        description: "Starting accepted release ordered-source fingerprint."
      - name: to_as_of_date
        description: "Ending accepted release as-of date."
      - name: to_release_revision
        description: "Ending accepted release revision number."
      - name: to_revision_fingerprint
        description: "Ending accepted release ordered-source fingerprint."
      - name: gap_days
        description: "Calendar-day gap between the accepted release endpoints."
      - name: measure_value
        description: "SQL-computed diagnostic numerator divided by its visible denominator; null for zero denominator."
      - name: wilson_95_lower
        description: "SQL-computed 95 percent Wilson lower bound for the diagnostic proportion."
      - name: wilson_95_upper
        description: "SQL-computed 95 percent Wilson upper bound for the diagnostic proportion."

  - name: mart_release_snapshot_metrics
    description: >
      Grain: one row per accepted release identity and locked published delinquent
      category. Keyed and unkeyed coverage share the visible all-record denominator.
    columns:
      - name: as_of_date
        tests: [not_null]
      - name: published_delinquent_category
        tests:
          - not_null
          - accepted_values:
              values: ['Delinquent', 'Delinquent - Late Fees Due']
      - name: published_delinquent_category_count
        tests: [not_null]
      - name: raw_total_record_count
        tests: [not_null]
      - name: keyed_coverage_denominator_id
        tests:
          - accepted_values:
              values: [all_promoted_release_records_v1]
      - name: unkeyed_coverage_denominator_id
        tests:
          - accepted_values:
              values: [all_promoted_release_records_v1]
      - name: release_revision
        description: "Accepted release revision number."
      - name: revision_fingerprint
        description: "Accepted release ordered-source fingerprint."
      - name: parser_contract_version
        description: "Parser contract used for the accepted release."
      - name: keyed_record_count
        description: "Promoted records admitted to the keyed analytical path in this release."
      - name: unkeyed_record_count
        description: "Promoted records excluded from the keyed analytical path in this release."
      - name: keyed_coverage_proportion
        description: "SQL-computed keyed records divided by all promoted release records."
      - name: keyed_coverage_wilson_95_lower
        description: "SQL-computed 95 percent Wilson lower bound for keyed coverage."
      - name: keyed_coverage_wilson_95_upper
        description: "SQL-computed 95 percent Wilson upper bound for keyed coverage."
      - name: unkeyed_coverage_proportion
        description: "SQL-computed unkeyed records divided by all promoted release records."
      - name: unkeyed_coverage_wilson_95_lower
        description: "SQL-computed 95 percent Wilson lower bound for unkeyed coverage."
      - name: unkeyed_coverage_wilson_95_upper
        description: "SQL-computed 95 percent Wilson upper bound for unkeyed coverage."

  - name: mart_starting_cohort_persistence
    description: >
      Grain: one row per actual accepted-release endpoint pair. A not-observed
      endpoint remains distinct and no missing horizon is bridged.
    columns:
      - name: from_as_of_date
        tests: [not_null]
      - name: to_as_of_date
        tests: [not_null]
      - name: gap_days
        tests: [not_null]
      - name: persistence_denominator_id
        tests:
          - accepted_values:
              values: [starting_published_delinquent_cohort_v1]
      - name: from_release_revision
        description: "Starting accepted release revision number."
      - name: from_revision_fingerprint
        description: "Starting accepted release ordered-source fingerprint."
      - name: to_release_revision
        description: "Ending accepted release revision number."
      - name: to_revision_fingerprint
        description: "Ending accepted release ordered-source fingerprint."
      - name: starting_delinquent_count
        description: "Starting published delinquent population at the exact endpoint pair."
      - name: still_delinquent_count
        description: "Starting published delinquent population observed in that population at the endpoint."
      - name: observed_exit_count
        description: "Starting published delinquent population observed outside the closed statuses at the endpoint."
      - name: not_observed_count
        description: "Starting published delinquent population absent at the endpoint; never an observed exit."
      - name: persistence_proportion
        description: "SQL-computed still-observed published delinquent population divided by its starting cohort."

  - name: mart_source_reported_status_age
    description: >
      Grain: one row per accepted release and source-reported prevalent-snapshot
      age bucket. This is source-reported status age, not event duration.
    columns:
      - name: source_reported_status_age_state
        tests:
          - not_null
          - accepted_values:
              values: [valid_reported_date, future_reported_date, missing, invalid_nonblank]
      - name: record_count
        tests: [not_null]
      - name: as_of_date
        description: "Accepted release as-of date."
      - name: release_revision
        description: "Accepted release revision number."
      - name: revision_fingerprint
        description: "Accepted release ordered-source fingerprint."
      - name: source_reported_status_age_days
        description: "Source-reported status-date age in days within this prevalent snapshot; null for missing, invalid, or future dates."

  - name: mart_spell_censoring_summary
    description: 'Grain: one row per authoritative closed spell terminal state.'
    columns:
      - name: terminal_state
        tests:
          - not_null
          - accepted_values:
              values: [observed_exit, right_censored, lost_to_observation]
      - name: spell_count
        tests: [not_null]

  - name: mart_release_quality
    description: >
      Grain: one row per accepted release identity. Descriptive release-health,
      schema-contract, parser-contract, rule, and capture outcome counts only.
    columns:
      - name: as_of_date
        tests: [not_null]
      - name: release_health_state
        tests:
          - accepted_values:
              values: [accepted_healthy, accepted_review]
      - name: schema_contract_version
        tests:
          - accepted_values:
              values: [registry-csv-contract-v1]
      - name: parser_contract_version
        tests: [not_null]
      - name: release_revision
        description: "Accepted release revision number."
      - name: revision_fingerprint
        description: "Accepted release ordered-source fingerprint."
      - name: release_flag_count
        description: "Release-scoped diagnostic flag count."
      - name: release_flag_pass_count
        description: "Release-scoped diagnostic flags whose result is pass."
      - name: release_flag_review_count
        description: "Release-scoped diagnostic flags whose result is review."
      - name: release_flag_rule_versions
        description: "Deterministically ordered release diagnostic rule and parameter versions."
      - name: schema_added_column_count
        description: "Added source-contract columns in this accepted release; zero under strict admission."
      - name: schema_removed_column_count
        description: "Removed source-contract columns in this accepted release; zero under strict admission."
      - name: schema_type_changed_column_count
        description: "Changed source-contract column types in this accepted release; zero under strict admission."
      - name: capture_attempted_count
        description: "Capture attempts attributed to this accepted release identity."
      - name: capture_succeeded_count
        description: "Accepted or recovered capture attempts attributed to this release identity."
      - name: capture_failed_count
        description: "Rejected capture attempts attributed to this release identity."
      - name: capture_unavailable_count
        description: "No-new-release capture attempts attributed to this release identity."

  - name: mart_adjacent_pair_metrics
    description: >
      Grain: one row per exact adjacent accepted-release pair identity.
      Reports identity-free counts for the published delinquent population,
      observed exits, still delinquent observations, not-observed keys,
      matched observed entries, newly observed delinquent keys, all entrants,
      signed net movement, and one descriptive largest matched status-to-status
      transition. It is not an organization-level relation. Nullable statuses
      use __NULL_STATUS__ only as a deterministic lexical sort token; projected
      status values retain null.
    columns:
      - name: from_as_of_date
        tests: [not_null]
      - name: from_release_revision
        tests: [not_null]
      - name: from_revision_fingerprint
        tests: [not_null]
      - name: to_as_of_date
        tests: [not_null]
      - name: to_release_revision
        tests: [not_null]
      - name: to_revision_fingerprint
        tests: [not_null]
      - name: gap_days
        tests: [not_null]
      - name: starting_delinquent_count
        description: Full starting published delinquent population; includes keys not observed at the endpoint.
        tests: [not_null]
      - name: ending_published_delinquent_count
        tests: [not_null]
      - name: observed_exit_count
        description: Starting published delinquent keys observed at the endpoint outside the closed delinquent statuses.
        tests: [not_null]
      - name: still_delinquent_count
        tests: [not_null]
      - name: not_observed_count
        description: Starting published delinquent keys absent at the endpoint; not an observed exit.
        tests: [not_null]
      - name: matched_observed_entry_count
        description: Keys observed at both endpoints that enter the published delinquent population.
        tests: [not_null]
      - name: newly_observed_delinquent_count
        tests: [not_null]
      - name: total_entrant_count
        description: Matched observed entries plus newly observed delinquent keys.
        tests: [not_null]
      - name: net_delinquent_movement
        description: Ending minus starting published delinquent population at this exact pair grain.
        tests: [not_null]
      - name: observed_exit_denominator_id
        tests:
          - not_null
          - accepted_values:
              values: [starting_published_delinquent_cohort_v1]
      - name: observed_exit_proportion
        description: Observed exits divided by the full starting published delinquent population; null when its visible denominator is zero.
      - name: observed_exit_wilson_95_lower
        description: SQL-computed 95 percent Wilson lower bound; null when the denominator is zero.
      - name: observed_exit_wilson_95_upper
        description: SQL-computed 95 percent Wilson upper bound; null when the denominator is zero.
      - name: largest_transition_from_status
        description: Source-reported start status for the deterministic largest matched status-to-status transition.
      - name: largest_transition_to_status
        description: Source-reported end status for the deterministic largest matched status-to-status transition.
      - name: largest_transition_count
        description: Count for the descriptive status-pair maximum; never an organization ranking.
      - name: matched_entry_denominator_id
        tests:
          - not_null
          - accepted_values:
              values: [matched_observed_entry_population_v1]
      - name: total_entrant_denominator_id
        tests:
          - not_null
          - accepted_values:
              values: [all_entrant_population_v1]
