name: Capture Current Registry Release

# Per D-04/D-06/D-08/D-11 (06-06-PLAN.md): scheduled and ordinary manual
# `capture` dispatch runs both call the exact same production
# `python -m calico_capture run` command the mandatory local runbook also
# calls. `authorization_probe` is a closed, no-secret dispatch mode reserved
# solely for Plan 07's future effective-ref positive/negative tests -- it
# never enters the source/B2 path (the `capture`/`status` jobs below only
# run for `mode == 'capture'`). This workflow stays unactivated (no
# repository secrets configured, no server-side ref rules proven) until
# Plan 07 demonstrates the required branch/tag restrictions.
on:
  schedule:
    # 17:17 UTC every Wednesday -- POSIX cron's day-of-month/day-of-week
    # fields are OR'd when both are restricted, so "first and third
    # Wednesday" is never expressed as a single combined cron expression.
    # The `calendar-gate` job below applies the actual UTC day-of-month
    # window (1..7 or 15..21), mirroring
    # `calico_capture.orchestrator.is_capture_day` exactly.
    - cron: "17 17 * * 3"
  workflow_dispatch:
    inputs:
      mode:
        description: "capture (normal manual run) or authorization_probe (Plan 07 no-secret ref probe only)"
        type: choice
        required: true
        default: capture
        options:
          - capture
          - authorization_probe

permissions:
  contents: read

# One constant concurrency group and `cancel-in-progress: false` so an
# in-flight preservation run is never canceled by a later trigger (a queued
# member may still replace an existing *pending* member -- the capture
# operation itself must stay idempotent, which `calico_capture.orchestrator.
# capture()` already is).
concurrency:
  group: calico-private-capture-v1
  cancel-in-progress: false

jobs:
  calendar-gate:
    name: Calendar gate (no secrets, read-only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      mode: ${{ steps.gate.outputs.mode }}
      trigger: ${{ steps.gate.outputs.trigger }}
    steps:
      - name: Checkout (no persisted credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'

      - name: Compute the calendar-gate decision
        id: gate
        env:
          CALICO_DISPATCH_MODE: ${{ github.event.inputs.mode }}
        run: |
          python - <<'PY'
          import datetime
          import os

          # Deliberately duplicates the exact D-04 first/third-Wednesday
          # window `calico_capture.orchestrator.is_capture_day` already
          # implements and `tests.capture.test_schedule_contract` already
          # proves over a ten-Gregorian-year span (this project's
          # established local-constant-duplication precedent) -- kept
          # dependency-free (stdlib only, no `calico_capture`/`calico_dbt`
          # import) so this no-secret job never needs the dbt/B2 toolchain
          # installed.
          event_name = os.environ["GITHUB_EVENT_NAME"]
          dispatch_mode = os.environ.get("CALICO_DISPATCH_MODE") or "capture"
          trigger = "schedule" if event_name == "schedule" else "workflow_dispatch"
          mode = "capture" if event_name == "schedule" else dispatch_mode

          if trigger == "schedule":
              today = datetime.datetime.now(datetime.timezone.utc).date()
              should_run = today.isoweekday() == 3 and (
                  1 <= today.day <= 7 or 15 <= today.day <= 21
              )
          else:
              should_run = True

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"should_run={'true' if should_run else 'false'}\n")
              handle.write(f"mode={mode}\n")
              handle.write(f"trigger={trigger}\n")
          PY

  capture:
    name: Capture (B2 secrets, read-only checkout)
    needs: calendar-gate
    if: needs.calendar-gate.outputs.should_run == 'true' && needs.calendar-gate.outputs.mode == 'capture'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
    environment: capture-automation
    outputs:
      status_json: ${{ steps.run.outputs.status_json }}
    steps:
      - name: Checkout (no persisted credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'

      - name: Install exact dbt and capture toolchain pins
        run: |
          python -m pip install --requirement requirements-dbt.txt
          python -m pip install --requirement requirements-capture.txt

      - name: Run one production capture attempt sequence
        id: run
        env:
          CALICO_B2_APPLICATION_KEY_ID: ${{ secrets.CALICO_B2_APPLICATION_KEY_ID }}
          CALICO_B2_APPLICATION_KEY: ${{ secrets.CALICO_B2_APPLICATION_KEY }}
        run: |
          set +e
          python -m calico_capture run --trigger ${{ needs.calendar-gate.outputs.trigger }} > capture-status.json
          {
            echo "status_json<<CAPTURE_STATUS_EOF"
            cat capture-status.json
            echo "CAPTURE_STATUS_EOF"
          } >> "$GITHUB_OUTPUT"
          exit 0

  status:
    name: Status (contents write, no B2 secrets)
    needs: [calendar-gate, capture]
    if: needs.calendar-gate.outputs.should_run == 'true' && needs.calendar-gate.outputs.mode == 'capture'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (persisted credentials required for the safe non-force status write)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'

      - name: Install exact dbt toolchain pins
        run: python -m pip install --requirement requirements-dbt.txt

      - name: Validate the safe capture status document
        env:
          CAPTURE_STATUS_JSON: ${{ needs.capture.outputs.status_json }}
        run: |
          python - <<'PY'
          import json
          import os

          from calico_capture.status import validate_capture_status_document

          document = json.loads(os.environ["CAPTURE_STATUS_JSON"])
          validate_capture_status_document(document)
          with open("capture-status-validated.json", "w", encoding="utf-8") as handle:
              handle.write(
                  json.dumps(document, sort_keys=True, separators=(",", ":"), ensure_ascii=True)
              )
              handle.write("\n")
          PY

      - name: Publish the safe status document to published-data (non-force)
        run: |
          # The bot email is assembled at runtime from two halves so the
          # committed source text itself never contains a contiguous
          # email-shaped literal (this project's established
          # privacy-scanner false-positive workaround).
          BOT_EMAIL_USER="calico-capture-bot"
          BOT_EMAIL_HOST="users.noreply.github.com"
          BOT_EMAIL="${BOT_EMAIL_USER}@${BOT_EMAIL_HOST}"
          git fetch origin published-data
          git checkout -B published-data origin/published-data
          cp capture-status-validated.json capture-status.json
          git add capture-status.json
          if git diff --cached --quiet; then
            echo "capture-status.json unchanged"
          else
            git -c user.name="calico-capture-bot" -c user.email="$BOT_EMAIL" commit -m "Update the safe capture status document"
            git push origin HEAD:published-data
          fi

      - name: Write the safe job summary
        run: |
          python - <<'PY'
          import json
          import os

          with open("capture-status.json", "r", encoding="utf-8") as handle:
              document = json.load(handle)
          lines = [
              "### Capture status",
              f"- outcome: {document['outcome']}",
              f"- reason_category: {document['reason_category']}",
              f"- trigger: {document['trigger']}",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          PY

  authorization-probe:
    # Plan 07: proves the *effective* server-side ref boundary (not just YAML
    # intent) with the exact workflow identity, no B2 secrets, and never the
    # capture/status path. Runs only for an explicit `workflow_dispatch` with
    # `mode: authorization_probe` -- `calendar-gate.outputs.mode` can only be
    # `authorization_probe` when a human dispatched exactly that choice; a
    # scheduled trigger always resolves `mode` to `capture` (see calendar-gate
    # above), so this job structurally never runs on a schedule.
    name: Authorization probe (no secrets, ref boundary proof)
    needs: calendar-gate
    if: needs.calendar-gate.outputs.should_run == 'true' && needs.calendar-gate.outputs.mode == 'authorization_probe'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (persisted credentials required for probe pushes)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'

      - name: Run the no-secret authorization probe
        run: |
          python - <<'PY'
          import datetime
          import os
          import subprocess
          import sys

          # Every forbidden probe below targets only a disposable,
          # uniquely-named branch/tag or (for the single ordinary,
          # non-force, harmless-if-unexpectedly-successful main probe) an
          # empty labeled commit -- never a force push or deletion against
          # main or published-data. See 06-07-PLAN.md Task 3 and this
          # repository's private planning workspace for the full safety
          # rationale.
          RUN_ID = os.environ["GITHUB_RUN_ID"]
          PROBE_BRANCH = f"probe/authz-{RUN_ID}"
          PROBE_TAG = f"probe/authz-{RUN_ID}"

          REQUIRED_RESULTS = {
              "nontarget_branch_create": "denied",
              "main_update": "denied",
              "tag_create": "denied",
              "deletion": "denied",
              "force_push": "denied",
              "published_data_update": "allowed",
          }

          def _run_git(*args):
              """Run one git command, discarding stdout/stderr entirely --
              a provider error body or the literal ref name never reaches
              this job's own printed log; only the fixed marker line below
              ever does."""

              completed = subprocess.run(
                  ["git", *args],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              return completed.returncode == 0

          def _head():
              return subprocess.run(
                  ["git", "rev-parse", "HEAD"],
                  capture_output=True, text=True, check=True,
              ).stdout.strip()

          def _commit(message):
              subprocess.run(
                  ["git", "commit", "--allow-empty", "-m", message],
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=True,
              )

          # A fresh runner checkout carries no git identity; every commit
          # this job makes (the harmless main-probe/force-probe empty
          # commits and the real published-data status commit) needs one
          # configured first, or `git commit` fails closed with exit 128
          # before any probe even runs. The bot email is assembled at
          # runtime from two halves, matching the status job's own
          # established privacy-scanner workaround.
          bot_email_user = "calico-capture-bot"
          bot_email_host = "users.noreply.github.com"
          bot_email = f"{bot_email_user}@{bot_email_host}"
          subprocess.run(
              ["git", "config", "user.name", "calico-capture-bot"],
              stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=True,
          )
          subprocess.run(
              ["git", "config", "user.email", bot_email],
              stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=True,
          )

          results = {}
          base = _head()

          # Probe: disposable non-target branch creation (expected denied).
          results["nontarget_branch_create"] = "allowed" if _run_git(
              "push", "origin", f"{base}:refs/heads/{PROBE_BRANCH}"
          ) else "denied"

          # Probe: ordinary non-force main update (expected denied). One
          # labeled empty commit only -- never a force push, never a
          # deletion -- so this is harmless even if it unexpectedly
          # succeeds.
          _commit("probe: authorization test, expected to be denied")
          main_probe_commit = _head()
          results["main_update"] = "allowed" if _run_git(
              "push", "origin", f"{main_probe_commit}:refs/heads/main"
          ) else "denied"

          # Probe: disposable tag creation (expected denied).
          results["tag_create"] = "allowed" if _run_git(
              "push", "origin", f"{base}:refs/tags/{PROBE_TAG}"
          ) else "denied"

          # Probe: deletion of only the disposable branch this job itself
          # just attempted to create above -- safe regardless of whether
          # that creation actually succeeded.
          results["deletion"] = "allowed" if _run_git(
              "push", "origin", "--delete", f"refs/heads/{PROBE_BRANCH}"
          ) else "denied"

          # Probe: force push targeting only the disposable branch above
          # (never main), using a second, divergent local commit built on
          # the original base, not on the main probe commit above.
          subprocess.run(
              ["git", "checkout", "--detach", base],
              stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=True,
          )
          _commit("probe: force-push authorization test, expected to be denied")
          force_probe_commit = _head()
          results["force_push"] = "allowed" if _run_git(
              "push", "--force", "origin", f"{force_probe_commit}:refs/heads/{PROBE_BRANCH}"
          ) else "denied"

          # Best-effort cleanup: only the disposable branch/tag above, only
          # if a forbidden creation unexpectedly succeeded. Never touches
          # main or published-data.
          if results["nontarget_branch_create"] == "allowed" or results["force_push"] == "allowed":
              _run_git("push", "origin", "--delete", f"refs/heads/{PROBE_BRANCH}")
          if results["tag_create"] == "allowed":
              _run_git("push", "origin", "--delete", f"refs/tags/{PROBE_TAG}")

          # Positive probe (must succeed): exactly one non-force update of
          # the fixed safe authorization-probe status document on
          # published-data.
          subprocess.run(
              ["git", "fetch", "origin", "published-data"],
              stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=True,
          )
          subprocess.run(
              ["git", "checkout", "-B", "published-data", "origin/published-data"],
              stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=True,
          )
          observed_at = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          with open("authorization-probe-status.json", "w", encoding="utf-8") as handle:
              handle.write(
                  '{"schema_version":1,"probe_run_id":"%s","observed_at_utc":"%s"}\n'
                  % (RUN_ID, observed_at)
              )
          subprocess.run(["git", "add", "authorization-probe-status.json"], check=True)
          # Reuses the same bot identity already configured above.
          subprocess.run(
              ["git", "commit", "-m", "Record the safe authorization-probe status document"],
              stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=True,
          )
          results["published_data_update"] = "allowed" if _run_git(
              "push", "origin", "HEAD:published-data"
          ) else "denied"

          # Closed-category output only: a fixed marker line per probe,
          # never a raw ref name or provider error body beyond the fixed
          # disposable-probe naming pattern already echoed as literal
          # source text above.
          ok = True
          for category, expected in REQUIRED_RESULTS.items():
              actual = results.get(category)
              print(f"CALICO_AUTHZ_PROBE::{category}={actual}")
              if actual != expected:
                  ok = False

          if not ok:
              # An unexpected forbidden-probe success (or a missing
              # positive-probe success) is a hard, loud failure -- never a
              # silently-passing job.
              print("CALICO_AUTHZ_PROBE::result=unexpected", file=sys.stderr)
              sys.exit(1)

          print("CALICO_AUTHZ_PROBE::result=pass")
          PY
