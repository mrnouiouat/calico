name: dbt Fixture Build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-build:
    name: Fixture-mode dbt build and contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history, no persisted credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'

      - name: Install exact dbt toolchain pins
        run: python -m pip install --requirement requirements-dbt.txt

      - name: Run full unittest discovery
        run: python -m unittest discover -s tests -v

      - name: Run the complete fixture-mode dbt build
        run: python -m calico_dbt build --mode fixture

      - name: Run the fixture-mode dbt docs proof
        run: python -m calico_dbt docs --mode fixture

      - name: Run repository, disposition-matrix, and CI contract tests
        run: python -m unittest tests.test_repository_contract tests.dbt_foundation.test_disposition_matrix tests.dbt_foundation.test_ci_contract -v

      - name: Run privacy gate (candidate tree + full reachable history)
        run: python -m tools.privacy_scan --tree HEAD --history-all
